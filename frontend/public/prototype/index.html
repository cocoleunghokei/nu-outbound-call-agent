<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call Agent — clickable prototype</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#F1F4F9; --surface-3:#E9EEF6; --ink:#111827; --muted:#6B7280; --line:#E5E9F0;
  --brand:#1A6DFF; --brand-soft:#E8F0FF; --brand-ink:#FFFFFF;
  --ok:#0E9F6E; --ok-soft:#E2F6EE; --warn:#C26A00; --warn-soft:#FFF3DF; --bad:#DC2626; --bad-soft:#FDECEC;
  --shadow:0 1px 2px rgba(17,24,39,.04), 0 12px 32px -18px rgba(26,109,255,.28);
  --float:0 24px 60px -22px rgba(17,24,39,.35);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell: rail | chat | agent panel ---------- */
:root{--pw:500px}
.app{display:grid;grid-template-columns:76px minmax(0,1fr) var(--pw);grid-template-rows:minmax(0,1fr);height:100%;overflow:hidden}
.resizer{position:fixed;top:0;bottom:0;right:calc(var(--pw) - 5px);width:10px;cursor:col-resize;z-index:25;touch-action:none}
.resizer::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:2px;background:transparent;transition:background .15s}
.resizer:hover::after,.resizer.drag::after{background:var(--brand)}
.resizer .grip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:44px;border-radius:6px;background:#CBD4E1;opacity:0;transition:opacity .15s}
.resizer:hover .grip,.resizer.drag .grip{opacity:1;background:var(--brand)}
body.resizing{cursor:col-resize;user-select:none}
.live-box .ping{margin:10px 0 2px;width:100%;padding:14px}
.live-box .ping .pq{font-size:18px}
.live-box .ping .opts button{padding:10px 13px}
.chat,.panel,.rail{min-height:0;overflow:hidden}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0}
.rail .logo{width:46px;height:46px;margin-bottom:22px;filter:drop-shadow(0 6px 10px rgba(22,85,236,.28))}
.logo svg{width:100%;height:100%;display:block}
.rbtn{position:relative;width:48px;height:48px;border-radius:16px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.rbtn:hover{background:var(--surface-2);color:var(--ink)}
.rbtn.on{background:var(--brand-soft);color:var(--brand)}
.rbtn .tip{position:absolute;left:58px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:30}
.rbtn:hover .tip,.rbtn:focus-visible .tip{opacity:1}
.rail .grow{flex:1}

.chat{display:flex;flex-direction:column;min-width:0;height:100%;background:linear-gradient(180deg,var(--surface) 0%,var(--surface) 55%,#EEF3FD 100%)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 22px}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;box-shadow:var(--shadow)}
.pill.ghost{box-shadow:none}
.mini-agent{display:none;border:0;background:none;padding:0;align-items:center;gap:8px}
.feed{flex:1;overflow-y:auto;padding:8px 22px 18px}
.feed-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.stamp{align-self:center;font-size:12.5px;color:var(--muted);margin:14px 0 4px}
.msg{max-width:min(82%,560px);padding:11px 16px;border-radius:22px;line-height:1.45}
.anim{animation:in .22s ease-out}
.msg.agent{align-self:flex-start;background:var(--surface-2)}
.msg.user{align-self:flex-end;background:var(--brand);color:#fff}
.msg.sub{font-size:13.5px;color:var(--muted);background:none;padding:0 6px}
.typing{align-self:flex-start;background:var(--surface-2);border-radius:22px;padding:14px 18px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:#A3ACBA;animation:dot 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chips{max-width:760px;margin:0 auto;width:100%;display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 10px;justify-content:flex-end}
.chip{border:1.5px solid #CFDDFB;background:var(--surface);color:var(--brand);border-radius:999px;padding:8px 15px;font-weight:600;font-size:14px}
.chip:hover{background:var(--brand-soft)}
.chip.quiet{color:var(--muted);border-color:var(--line)}
.composer-wrap{padding:0 22px 18px}
.composer{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 7px 7px 10px;box-shadow:var(--shadow)}
.composer.await{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft),var(--shadow)}
.composer.await input::placeholder{color:var(--brand);opacity:.75}
.composer input{flex:1;border:0;background:none;outline:none;padding:8px 6px;min-width:0}
.cbtn{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center;flex:none}
.cbtn:hover{background:var(--surface-2);color:var(--ink)}
.cbtn.send{background:var(--brand);color:#fff}
.cbtn.send:hover{filter:brightness(1.07);background:var(--brand);color:#fff}

/* inline cards in chat */
.ccard{align-self:flex-start;width:min(100%,560px);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);}
.ccard h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ccard .lead{color:var(--muted);font-size:14px;margin-top:4px}
.ccard .foot{display:flex;gap:10px;margin-top:16px}
.ccard .foot .btn{flex:1}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:#B9C6DA}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:#F6C9C9}
.btn.sm{padding:7px 13px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.how{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.how div{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start}
.how .ic{width:38px;height:38px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.how b{display:block;font-size:14.5px}
.how span{color:var(--muted);font-size:13.5px}
.done-line{font-size:13px;color:var(--muted);margin-top:12px;display:flex;align-items:center;gap:6px}
.done-line svg{color:var(--ok);width:16px;height:16px}

/* radio pair (Share freely / Ask me first) */
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.srow:last-child{border-bottom:0}
.srow b{font-size:14.5px;font-weight:600}
.srow small{display:block;color:var(--muted);font-size:12.5px;max-width:28ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.radios{display:inline-flex;gap:6px}
.radios button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 8px;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.radios button::before{content:"";width:15px;height:15px;border-radius:50%;border:2px solid #C9D1DD;flex:none}
.radios button.on{border-color:var(--brand);color:var(--ink);background:var(--brand-soft)}
.radios button.on::before{border-color:var(--brand);background:radial-gradient(circle,var(--brand) 0 3.5px,transparent 4px)}
.radios button.on.ask{border-color:var(--warn);background:var(--warn-soft)}
.radios button.on.ask::before{border-color:var(--warn);background:radial-gradient(circle,var(--warn) 0 3.5px,transparent 4px)}

/* avatar picker */
.looks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.look{border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700}
.look.on{border-color:var(--brand);background:var(--brand-soft)}
.look svg{width:84px;height:84px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;width:100%}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.input.err{border-color:var(--bad)}
.err-msg{color:var(--bad);font-size:13px;margin-top:6px}

/* review card */
.rv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 14px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.rv:first-of-type{border-top:0}
.rv dt{color:var(--muted);font-weight:600;font-size:13px;padding-top:1px}
.rv dd{margin:0}
.rv .say{background:var(--brand-soft);border-radius:16px 16px 16px 4px;padding:10px 13px;color:#123A8C}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:500}
.tg.free{background:var(--ok-soft);color:#065F46}
.tg.ask{background:var(--warn-soft);color:#7A4300}
.tg b{font-weight:800}

/* ping card in chat */
.ping{border:2px solid var(--brand);box-shadow:0 22px 48px -24px rgba(26,109,255,.6)}
.ping .ptop{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--brand)}
.ping .ptop .sec{color:var(--warn);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
.ping .pq{font-size:21px;font-weight:800;letter-spacing:-.015em;margin-top:8px;line-height:1.2}
.ping .why{color:var(--muted);margin-top:4px}
.ping .opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ping .opts button{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:11px 14px;font-weight:600;text-align:left;display:flex;align-items:center;gap:10px}
.ping .opts button:first-child{background:var(--brand);border-color:var(--brand);color:#fff}
.ping .opts button:not(:first-child):hover{border-color:var(--brand);background:var(--brand-soft)}
.ping .free{display:flex;gap:8px;margin-top:10px}
.ping .free input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--surface-2);min-width:0}
.ping .track{height:5px;border-radius:5px;background:var(--surface-3);margin-top:14px;overflow:hidden}
.ping .bar{height:100%;border-radius:5px;background:var(--brand);transition:width .25s linear}
.ping .fb{font-size:12.5px;color:var(--muted);margin-top:8px}
.ping.answered{border-color:var(--line);box-shadow:var(--shadow)}

.callcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.result .big{font-size:22px;font-weight:800;letter-spacing:-.015em;margin-top:6px}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-neutral{background:var(--surface-2);color:var(--muted)}
.b-live{background:var(--brand-soft);color:var(--brand)}

/* ---------- agent panel ---------- */
.panel{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;height:100%;min-height:0}
.panel .phead{display:flex;justify-content:flex-end;padding:14px 16px 0;min-height:52px}
.agent-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 20px 18px}
.av-wrap{position:relative;width:132px;height:132px;display:grid;place-items:center}
.av-wrap .ring{position:absolute;inset:6px;border-radius:50%;border:2px solid var(--brand);opacity:0}
.working .av-wrap .ring{animation:ripple 2s ease-out infinite}
.working .av-wrap .ring:nth-child(2){animation-delay:.7s}
.waiting .av-wrap .ring{border-color:var(--warn);animation:ripple 1.2s ease-out infinite}
@keyframes ripple{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.28);opacity:0}}
.av-wrap svg.avatar{width:120px;height:120px;position:relative;z-index:1}
.edit-av{position:absolute;right:4px;bottom:6px;z-index:2;width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);background:var(--ink);color:#fff;display:grid;place-items:center}
.edit-av svg{width:16px;height:16px}
.agent-hero .nm{font-size:24px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.agent-hero .st{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:600;margin-top:2px}
.agent-hero .st svg{width:17px;height:17px}
.working .st svg.spin{animation:spin 1.6s linear infinite;color:var(--brand)}
.waiting .st{color:var(--warn)}
@keyframes spin{to{transform:rotate(360deg)}}
/* avatar inner motion */
.avatar .eyes{transform-origin:60px 63px;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.avatar .mic{transition:fill .2s}
.working .avatar .mic,.waiting .avatar .mic{animation:micp 1s ease-in-out infinite}
@keyframes micp{50%{opacity:.35}}
.working .avatar .head{animation:bob 2.4s ease-in-out infinite;transform-origin:60px 90px}
/* taking notes: while the assistant is asking questions before a call */
.notes-fx{position:absolute;left:-6%;bottom:-4%;width:48%;height:48%;z-index:3;display:none;animation:in .25s ease-out}
.notes-fx svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 8px rgba(26,109,255,.25))}
.notes .notes-fx{display:block}
.notes .avatar .head{animation:nod 1.6s ease-in-out infinite;transform-origin:60px 90px}
@keyframes nod{50%{transform:rotate(5deg) translateY(1.5px)}}
.notes-fx .nl{fill:none;stroke:#1A6DFF;stroke-width:3.2;stroke-linecap:round}
.notes-fx .n1,.notes-fx .n2{stroke-dasharray:28;stroke-dashoffset:28}
.notes-fx .n3{stroke-dasharray:18;stroke-dashoffset:18}
.notes .notes-fx .n1{animation:w1 2.6s linear infinite}
.notes .notes-fx .n2{animation:w2 2.6s linear infinite}
.notes .notes-fx .n3{animation:w3 2.6s linear infinite}
@keyframes w1{0%{stroke-dashoffset:28}30%,94%{stroke-dashoffset:0}100%{stroke-dashoffset:28}}
@keyframes w2{0%,33%{stroke-dashoffset:28}63%,94%{stroke-dashoffset:0}100%{stroke-dashoffset:28}}
@keyframes w3{0%,66%{stroke-dashoffset:18}88%,94%{stroke-dashoffset:0}100%{stroke-dashoffset:18}}
.notes-fx .pen{transform:translate(14px,22px)}
.notes .notes-fx .pen{animation:pen 2.6s linear infinite}
@keyframes pen{0%{transform:translate(14px,22px)}30%{transform:translate(42px,22px)}33%{transform:translate(14px,32px)}63%{transform:translate(42px,32px)}66%{transform:translate(14px,42px)}88%{transform:translate(32px,42px)}94%{transform:translate(34px,40px)}100%{transform:translate(14px,22px)}}
.notes .st{color:var(--brand)}
.notes .st svg{animation:scribble .45s ease-in-out infinite alternate;transform-origin:20% 80%}
@keyframes scribble{to{transform:rotate(-14deg) translateX(1px)}}
.working .st svg.ringing{animation:ringshake 1.3s ease-in-out infinite;color:var(--brand)}
@keyframes ringshake{0%,55%,100%{transform:rotate(0)}10%{transform:rotate(-16deg)}20%{transform:rotate(14deg)}30%{transform:rotate(-10deg)}40%{transform:rotate(8deg)}}
.notes .mini-agent .lbl span,.mini-agent.notes .lbl span{color:var(--brand)}
@keyframes bob{50%{transform:rotate(-3deg) translateY(-1px)}}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 18px;background:var(--surface-2);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;border-radius:999px;padding:8px 0;color:var(--muted);display:grid;place-items:center;position:relative}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs button .tip{position:absolute;top:calc(100% + 6px);background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;z-index:5}
.tabs button:hover .tip{opacity:1}
.pbody{flex:1;overflow-y:auto;padding:18px 18px 24px;min-height:0}
.sec-t{font-weight:700;font-size:15px;margin:4px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.task{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:10px;border-radius:18px;border:0;background:none;text-align:left;width:100%}
.task:hover{background:var(--surface-2)}
.task .tic{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.task.live .tic{background:var(--brand-soft);color:var(--brand)}
.task.wait .tic{background:var(--warn-soft);color:var(--warn)}
.task b{display:block;font-size:14.5px}
.task span{display:block;color:var(--muted);font-size:13px}
.task time{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.live-box{border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:18px;background:linear-gradient(180deg,#F7FAFF,#fff)}
.live-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.live-head .clk{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--muted)}
.states{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.states span{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.states span.on{background:var(--brand);color:#fff}
.states span.on.w{background:var(--warn);color:#fff}
.states span.later{opacity:.5}
.ptx{height:min(46vh,460px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.ln{display:flex;flex-direction:column;gap:3px;max-width:92%;font-size:15px;animation:in .2s ease-out}
.ln .who{font-size:12px;font-weight:700;color:var(--muted);padding:0 4px}
.ln .tx{padding:9px 13px;border-radius:16px;line-height:1.45}
.expand{border:0;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.expand svg{width:14px;height:14px}
/* full-size live call page */
.lhead{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center}
.lhead .bav{width:64px;height:64px}
.lhead h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.lhead .meta{color:var(--muted);font-size:14px}
.lclock{text-align:right;font-variant-numeric:tabular-nums}
.lclock b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em}
.lclock small{color:var(--muted);font-size:12px}
.lstates{margin:14px 0 4px}
.lstates span{font-size:12.5px;padding:4px 11px}
.lconv{padding:18px 20px}

/* ---------- chat engine ---------- */
let botQ = [], botBusy = false;
function bot(item){ botQ.push(typeof item === 'string' ? {text:item} : item); if (!botBusy) pump(); }
function pump(){
  const item = botQ.shift();
  if (!item) { botBusy = false; S.typing = false; refresh(); return; }
  botBusy = true; S.typing = !item.fn; refresh();
  setTimeout(()=>{
    if (item.fn) item.fn();
    else S.msgs.push({from:'agent', kind:item.kind||'text', text:item.text, data:item.data});
    pump();
  }, item.fn ? 0 : (item.delay ?? 650));
}
function user(text){ S.msgs.push({from:'user', kind:'text', text}); }
function setChips(list){ S.chips = list; }
function ask(text, chips, handler, ph){ bot(text); bot({fn:()=>{ setChips(chips||[]); S.awaiting = handler; setPh(ph); }}); }
function setPh(ph){
  const el = $('#comp'), box = document.querySelector('.composer');
  el.placeholder = ph || 'Send a message';
  box.classList.toggle('await', !!ph);
  if (ph && !matchMedia('(max-width:900px)').matches) el.focus();
}
function pickChip(i){ const c = S.chips[i]; if (!c) return; S.chips = []; setPh(null); c.fn(c.label); refresh(); }
function sendComp(){
  setPh(null);
  const el = $('#comp'); const t = el.value.trim(); if (!t) return; el.value = '';
  S.chips = [];
  if (S.awaiting) { const h = S.awaiting; S.awaiting = null; h(t); }
  else freeText(t);
  refresh();
}
function answerVia(handler){ return label => { S.awaiting = null; handler(label); }; }

const TPLS = [
  ['doc-resched','Doctor: reschedule','P1'], ['doc-book','Doctor: book','P0'], ['rest-book','Restaurant: book','P0'], ['rest-cancel','Restaurant: cancel','P1'],

function newCallChips(){
  if (S.phase !== 'ready') return;
  setChips([...TPLS.map(([id,l])=>({label:l, fn:()=>{ user(l); startFlow(id); }})), {label:'Something else', quiet:true, fn:()=>{ user('Something else'); ask('Sure. Tell me what you need in plain words, like “Call Tatte and ask if they can hold a table for 6 at 7pm.”', [], t=>{ user(t); routeText(t); }); }}]);
  S.awaiting = null; refresh();
}
function freeText(t){
  user(t);
  if (S.phase !== 'ready') { bot('Let’s finish setting up first. It only takes a minute.'); return; }
  routeText(t);
}
function routeText(t){
  if (/resched|move|dr\.?\s|doctor|appointment/i.test(t)) startFlow(/book|new/i.test(t) && !/resched|move/i.test(t) ? 'doc-book' : 'doc-resched');
  else if (/cancel/i.test(t) && /reserv|table|restaurant/i.test(t)) startFlow('rest-cancel');
  else if (/table|restaurant|dinner|lunch|reserv|tatte/i.test(t)) startFlow('rest-book', t);
  else startFlow('custom', t);
}

  if (tpl==='rest-book' || tpl==='rest-cancel') return {...base, title: tpl==='rest-book'?'Book a table':'Cancel a reservation', business:'Tatte Bakery & Cafe', number:'(617) 555-0133',

  if (m.kind==='how') return `<div class="ccard"><h3>How I make calls ${tag('ON-2','P1')}</h3>
      <div class="how">

        <div><span class="ic">${ic('phone')}</span><p><b>I call from our number</b><span>Businesses see our caller ID, not your personal phone.</span></p></div>
        <div><span class="ic">${ic('ask')}</span><p><b>I pause and ask you</b><span>When I’m unsure, I keep the line open and ping you for a one-tap answer.</span></p></div>

      ${m.done ? `<div class="done-line">${ic('check')}Acknowledged</div>` : `<div class="foot"><button class="btn primary" onclick="howAck()">Got it</button></div>`}</div>`;
  if (m.kind==='share') return `<div class="ccard"><h3>What can I share on calls? ${tag('ON-5','P1')}</h3>
      <p class="lead">“Ask me first” always pings you before I say it out loud, however sure I am.</p>

function shareRow(f, locked){

      <button role="radio" aria-checked="${v==='ask'}" class="${v==='ask'?'on ask':''}" ${locked?'disabled':''} onclick="setShare('${f.k}','ask')">Ask me first</button>

}
function avatarPicker(where){

function setLook(k, where){
  const wasDefault = Object.values(LOOKS).some(L=>L.name===S.agent.name);

function setName(v){ S.agent.name = v.trim() || LOOKS[S.agent.look].name; renderTop(); renderHero(); }
function reviewHTML(){

    <dl style="margin:10px 0 0">
      <div class="rv"><dt>Goal</dt><dd><b>${esc(b.goal)}</b>${answers.length?`<div class="small muted">${answers.map(esc).join(', ')}</div>`:''}</dd></div>
      <div class="rv"><dt>Calling</dt><dd>${esc(b.business)}, ${esc(b.number)} ${tag('PC-8','P0')}</dd></div>
      <div class="rv"><dt>I’ll open with</dt><dd><div class="say">“${esc(b.opening)}”</div> ${tag('DC-1','P0')}</dd></div>
      <div class="rv"><dt>I may share</dt><dd><div class="tags">${free.map(x=>`<span class="tg free">${x}</span>`).join('')}</div></dd></div>
      <div class="rv"><dt>I’ll ask first</dt><dd><div class="tags">${ask.map(x=>`<span class="tg ask">${x}</span>`).join('')}</div>
        ${S.share.dob==='ask' && !b.started ? `<label class="switch" style="margin-top:8px;font-size:13.5px"><span>Let me share date of birth on this call</span><input type="checkbox" ${b.allowDob?'checked':''} onchange="S.brief.allowDob=this.checked"></label>`:''}</dd></div>
      <div class="rv"><dt>Must</dt><dd><div class="tags">${b.hard.length?b.hard.map(x=>`<span class="tg">${esc(x)}</span>`).join(''):'<span class="muted">No limits</span>'}</div></dd></div>
      <div class="rv"><dt>Fallbacks</dt><dd><div class="tags">${b.fallbacks.length?b.fallbacks.map((x,i)=>`<span class="tg"><b>${i+1}</b>${esc(x)}</span>`).join(''):'<span class="muted">None, I’ll ask you</span>'}</div></dd></div>
      <div class="rv"><dt>Never agree to</dt><dd><div class="tags">${b.never.map(x=>`<span class="tg">${esc(x)}</span>`).join('')}</div> ${tag('DC-13','P0')}</dd></div>
    </dl>
    ${b.started ? `<div class="done-line">${ic('check')}Call started</div>` : `<div class="foot"><button class="btn" onclick="openModal('edit')">Edit</button><button class="btn primary" onclick="startCall()">${ic('phone')}Start call</button></div>`}
  </div>`;
}
function pingHTML(p){
  if (p.answer) return `<div class="ccard ping answered"><div class="ptop"><span>${esc(p.q)}</span></div><div class="done-line">${ic('check')}${esc(p.answer)}</div></div>`;
  return `<div class="ccard ping" role="alertdialog" aria-label="${esc(S.agent.name)} needs your answer">
    <div class="ptop"><span>${esc(S.agent.name)} needs you ${p.tag}</span><span class="sec">${ic('clock')}<span data-sec="${p.id}">${Math.ceil(p.left)}s</span></span></div>
    <p class="pq">${esc(p.q)}</p><p class="why">${esc(p.why)} ${tag('DC-5','P0')}</p>
    <div class="opts">${p.replies.map(([l,v])=>`<button onclick="reply('${v}')">${esc(l)}</button>`).join('')}</div>
    ${p.free?`<div class="free"><input data-free="${p.id}" placeholder="Or type a reply" onkeydown="if(event.key==='Enter')sendFree('${p.id}')" aria-label="Type a reply"><button class="btn sm primary" onclick="sendFree('${p.id}')">Send</button></div>`:''}
    <div class="track"><div class="bar" data-bar="${p.id}" style="width:${p.left/45*100}%"></div></div>
    <p class="fb">${esc(p.timeoutText)} ${tag('DC-9','P0')}</p></div>`;
}
function resultHTML(id){
  const r = S.history.find(x=>x.id===id); if (!r) return '';
  const o = OUT[r.outcome];
  return `<div class="ccard result"><span class="badge ${o.b}">${o.label}</span> ${tag('PO-5','P0')}
    <p class="big">${r.outcome==='rescheduled' ? esc(r.when) : 'Nothing was booked'}</p>
    <p class="lead">${r.outcome==='rescheduled' ? 'With Dr. Lee at Brookline. Confirmation #4821. I updated your calendar.' : esc(r.open[0]||'')}</p>
    <div class="foot">${r.outcome==='rescheduled'
      ? `<button class="btn" onclick="goPage('calendar');pickEv(S.events.find(e=>e.rec==='${r.id}'&&e.status==='rescheduled').id)">${ic('cal')}See on calendar</button>`
      : `<button class="btn" onclick="callAgain('${r.id}')">Call again</button>`}
      <button class="btn primary" onclick="openCall('${r.id}')">View call record</button></div></div>`;
}

/* ---------- agent panel ---------- */

function renderHero(){
  const el = $('#hero'); if (!el) return;
  const a = agentState();
  const sig = a.k + a.t + S.agent.look + S.agent.name;
  if (el.dataset.sig === sig) return; el.dataset.sig = sig;
  el.className = 'agent-hero ' + a.k;
  el.innerHTML = `<div class="av-wrap"><span class="ring"></span><span class="ring"></span>${avatarSVG(S.agent.look)}${NOTES_FX}
      <button class="edit-av" onclick="openModal('avatar')" aria-label="Edit avatar and name">${ic('pen')}</button></div>
    <div class="nm">${esc(S.agent.name)}</div>
    <div class="st">${a.k!=='idle'?`<svg class="i ${a.i==='tools'?'spin':a.i==='phone'?'ringing':''}" viewBox="0 0 24 24" aria-hidden="true">${IP[a.i]}</svg>`:ic('check')}${a.t}</div>`;
}
function renderPanel(){
  const oldHero = $('#hero');
  if (S.page && S.page!=='chat' && document.getElementById('pageView') && !document.getElementById('pageView').hidden) { const mt = document.querySelector('#pageView .mini-agent'); if (mt) { const a = agentState(); mt.className = 'mini-agent ' + a.k; const sp = mt.querySelector('.lbl span'); if (sp) sp.textContent = a.t; } }
  const p = $('#panel');
  p.classList.toggle('open', S.panel);
  const tabs = [['tasks','list','Tasks'],['privacy','shield','Privacy'],['history','clock','History'],['you','finger','You']];

    <div id="hero"></div>
    <div class="tabs" role="tablist">${tabs.map(([k,i,l])=>`<button role="tab" aria-selected="${S.tab===k}" class="${S.tab===k?'on':''}" onclick="S.tab='${k}';renderPanel()" aria-label="${l}">${ic(i)}<span class="tip">${l}</span></button>`).join('')}</div>
    <div class="pbody" id="pbody">${panelBody()}</div>`;

    ${S.history.length ? S.history.map(r=>`<button class="task" onclick="openModal({sum:'${r.id}'})"><span class="tic">${ic('phone')}</span><span><b>${esc(r.business)}</b><span>${esc(r.goal)}</span><time><span class="badge ${OUT[r.outcome].b}">${OUT[r.outcome].label}${r.failNote?': '+esc(r.failNote):''}</span> ${esc(r.date)}</time></span></button>`).join('') : '<div class="empty">No calls saved.</div>'}`;
  if (S.tab==='privacy') return `<div class="sec-t">What I can share ${tag('ON-5','P1')}</div>
    <div class="box" style="padding:4px 14px">${[...FIELDS, ...EXT].map(f=>shareRow(f,false)).join('')}</div>
    <div class="sec-t">Your data ${tag('Retention','Not built')}</div>
    <div class="box stack">
      <label class="switch"><span>Delete transcripts after 30 days</span><input type="checkbox" ${S.retention?'checked':''} onchange="S.retention=this.checked"></label>
      <p class="small muted" style="margin:8px 0 12px">Audio is never stored. Only transcripts and summaries are kept.</p>
      <button class="btn danger sm" onclick="if(confirm('Delete all calls, transcripts, and profile data? This can’t be undone.')){S.history=[];toast({title:'All data deleted',body:'Your calls and transcripts are gone.'});renderPanel()}">Delete all my data</button>

    <div class="sec-t">More details ${tag('ON-4','P1')}</div>
    <div class="box" style="padding:4px 14px">${EXT.map(f=>`<div class="prow"><label for="px-${f.k}">${f.label}</label><input class="input" id="px-${f.k}" value="${esc(S.ext[f.k])}" oninput="S.ext['${f.k}']=this.value"></div>`).join('')}</div>
    <div class="sec-t">Connections</div>
    <div class="box">
      <div class="switch" style="margin-bottom:10px"><span>${ic('cal')} Google Calendar ${tag('PC-10','P1')}</span><button class="btn sm ${S.calendar?'':'primary'}" onclick="S.calendar=!S.calendar;renderPanel()">${S.calendar?'Disconnect':'Connect'}</button></div>
      <div class="switch"><span>${ic('bell')} Notifications</span>${S.notif==='granted'?`<button class="btn sm" onclick="toast({title:'Test ping',body:'This is how I’ll reach you mid-call.'})">Send test</button>`:`<button class="btn sm primary" onclick="S.notif='granted';renderPanel()">Turn on</button>`}</div>

function renderPanelLive(full){
  const box = $('#livebox'); const c = C(); if (!box || !c) return;
  if (full || !box.innerHTML) {
    const b = S.brief;
    box.innerHTML = `<div class="live-box">
      <div class="live-head"><div><b>${esc(c.business)}</b><div class="small muted">${esc(b.number)} <span class="clk" id="pclk">${fmt(Date.now()-c.t0)}</span></div></div></div>
      <div class="states" id="pstates"></div>
      <div class="ptx" id="ptx" aria-live="polite"></div>
      <div id="pping"></div>
      <div id="pctrl"></div>
      <dl class="rules"><dt>Must</dt><dd>${b.hard.map(esc).join(', ')||'No limits'}</dd><dt>Fallbacks</dt><dd>${b.fallbacks.map((x,i)=>`${i+1}. ${esc(x)}`).join('  ')||'None'}</dd><dt>Never</dt><dd>${b.never.map(esc).join(', ')}</dd></dl>
    </div>`;
  }
  $('#pstates').innerHTML = STATES.map(s=>`<span class="${c.status===s?'on':''} ${s==='Waiting on you'&&c.status===s?'w':''} ${s==='In phone menu'?'later':''}">${s}</span>`).join('') + ' ' + tag('DC-14','P0');
  const who = {agent:S.agent.name, biz:'Business', you:'You'};
  const tx = $('#ptx');
  const follow = full || !tx.dataset.n || (tx.scrollHeight - tx.scrollTop - tx.clientHeight < 80);
  tx.innerHTML = c.lines.map(l => l[0]==='note'
      ? `<div class="ln note"><span class="tx"><span class="k ${l[2]}">${{acted:'Acted',asked:'Asked you',ended:'Ended',noted:'Noted'}[l[2]]}</span><b>${esc(l[1])}</b>. ${esc(l[3])}</span></div>`
      : `<div class="ln ${l[0]}"><span class="who">${esc(who[l[0]])}</span><span class="tx">${esc(l[1])}</span></div>`).join('')
    + (c.status==='Dialing' ? '<div class="ln note"><span class="tx">Dialing…</span></div>' : '');
  if (follow || tx.dataset.n != c.lines.length) tx.scrollTop = tx.scrollHeight;
  tx.dataset.n = c.lines.length;
  const pb = $('#pbody');
  if (pb && S.tab === 'tasks' && c.status !== 'Ended') {
    const tr = tx.getBoundingClientRect(), br = pb.getBoundingClientRect();
    if (tr.bottom > br.bottom - 8) pb.scrollTop += tr.bottom - br.bottom + 90;
    else if (tr.top < br.top) pb.scrollTop -= br.top - tr.top + 10;
  }
  const pp = $('#pping'); if (pp) pp.innerHTML = c.ping ? `<div class="done-line" style="color:var(--warn);font-weight:600">${ic('ask')}${esc(S.agent.name)} is waiting for your answer in the chat</div>` : '';
  const ended = c.status==='Ended';
  const pc = $('#pctrl');
  const draft = $('#instr')?.value || '';
  pc.innerHTML = ended
    ? `<div class="ctrls"><button class="btn primary full" onclick="openCall('${c.rec.id}')">View call record</button></div>`
    : `${c.ping ? '' : `<div class="instr"><input class="input" id="instr" placeholder="Tell ${esc(S.agent.name)} something" onkeydown="if(event.key==='Enter')sendInstr()" aria-label="Instruction"><button class="btn sm" onclick="sendInstr()">Send</button></div>`}
      <div class="ctrls">
        <button class="btn sm" onclick="togglePause()">${ic(c.paused?'play':'pause')}${c.paused?'Resume':'Pause'}</button>
        <button class="btn sm danger" onclick="endCall()">End call</button>
        <button class="btn sm full" disabled>${ic('mic')}Take over with my mic ${tag('DC-12','P1')}</button>
      </div><div class="small" style="margin-top:6px">${tag('DC-10','P0')} ${tag('DC-11','P0')} ${tag('DC-15','P1')}</div>`;
  const ni = $('#instr'); if (ni && draft) ni.value = draft;
}

function openModal(m){ if (m && m.sum) { openCall(m.sum); return; } S.modal = m; S.drawer = false; renderDrawer(); renderModal(); }
function closeModal(){ S.modal = null; renderModal(); refresh(); }
function renderModal(){

function applyName(){ if (S.brief && !S.brief.started && S.brief.opening) S.brief.opening = S.brief.opening.replace(/I’m [^,]+, an AI/, `I’m ${S.agent.name}, an AI`); }

      <div class="add"><input class="input" id="add-${key}" placeholder="${ph}" onkeydown="if(event.key==='Enter')addTo('${key}')"><button class="btn sm" onclick="addTo('${key}')">Add</button></div></div>`;
  return `<div class="mh"><div><h2>Edit the plan</h2><p class="small muted" style="margin-top:4px">${esc(b.business)}</p></div><button class="xbtn" onclick="closeModal()" aria-label="Close">${ic('x')}</button></div>

      <div class="booked-by">${rec ? avatarSVG(S.agent.look) + `<span>${sel.status==='cancelled'?'Cancelled':'Booked'} by ${esc(S.agent.name)} on a call ${rec.date==='Today'?'today':'on '+esc(rec.date)}${rec.time?' at '+esc(rec.time):''}.</span>` : `<span class="muted">${esc(sel.note||'Added from your calendar.')}</span>`}</div>
      <div class="actions">${rec?`<button class="btn primary" onclick="openCall('${rec.id}')">Open call record</button>`:''}${sel.status!=='cancelled'?`<button class="btn" onclick="toast({title:'Added to Google Calendar',body:'${esc(sel.title)}'})">${ic('cal')}Add to Google Calendar ${tag('PO-9','P1')}</button>`:''}</div>
    </div>` : `<div class="evcard"><h3>${dayList.length ? fmtDay(S.calDay+'T12:00') : 'Pick a booking'}</h3><p class="muted small" style="margin-top:4px">${dayList.length ? 'Tap a booking to see which call made it.' : 'Every booking, change, and cancellation your assistant makes shows up here with the call it came from.'}</p></div>`;

      <div class="cal-nav"><button class="btn sm" onclick="calToday()">Today</button><button class="xbtn" onclick="calMove(-1)" aria-label="Previous month">‹</button><button class="xbtn" onclick="calMove(1)" aria-label="Next month">›</button></div></div>

function setShare(k, v){ S.share[k] = v; refresh(); if (S.page !== 'chat') renderPage(); }
function vPrivacy(){
  const inp = (f, src, key) => `<div class="prow"><label for="pv-${f.k}">${f.label}</label><input class="input" id="pv-${f.k}" value="${esc(src[f.k])}" oninput="S.${key}['${f.k}']=this.value"></div>`;
  return `<div class="ph"><div><h1>Privacy & profile ${tag('ON-7','P0')}</h1><p>What ${esc(S.agent.name)} knows about you, and what it may say on a call. Changes apply to your next call.</p></div></div>
    <div class="agenda">
      <section>
        <div class="rcard" style="margin-top:0"><h2>What I can share ${tag('ON-5','P1')}</h2>
          <p class="small muted" style="margin:-6px 0 6px">“Ask me first” always pings you before it’s said out loud, however sure ${esc(S.agent.name)} is.</p>
          ${[...FIELDS, ...EXT].map(f=>shareRow(f,false)).join('')}</div>
        <div class="rcard"><h2>Your data ${tag('Retention','Not built')}</h2>
          <label class="switch"><span>Delete transcripts after 30 days</span><input type="checkbox" ${S.retention?'checked':''} onchange="S.retention=this.checked"></label>
          <p class="small muted" style="margin:8px 0 14px">Audio is never stored. Only transcripts and summaries are kept.</p>
          <button class="btn danger sm" onclick="if(confirm('Delete all calls, transcripts, and profile data? This can’t be undone.')){S.history=[];S.events=[];toast({title:'All data deleted',body:'Your calls and transcripts are gone.'});renderPage()}">Delete all my data</button></div>
      </section>
      <section>
        <div class="rcard" style="margin-top:0"><h2>Your details</h2>${FIELDS.map(f=>inp(f,S.profile,'profile')).join('')}</div>
        <div class="rcard"><h2>More details ${tag('ON-4','P1')}</h2>${EXT.map(f=>inp(f,S.ext,'ext')).join('')}</div>
        <div class="rcard"><h2>Connections</h2>
          <div class="switch" style="margin-bottom:12px"><span style="display:inline-flex;gap:8px;align-items:center">${ic('cal')} Google Calendar ${tag('PC-10','P1')}</span><button class="btn sm ${S.calendar?'':'primary'}" onclick="S.calendar=!S.calendar;renderPage()">${S.calendar?'Disconnect':'Connect'}</button></div>
          <div class="switch"><span style="display:inline-flex;gap:8px;align-items:center">${ic('bell')} Notifications</span>${S.notif==='granted'?`<button class="btn sm" onclick="toast({title:'Test ping',body:'This is how I’ll reach you mid-call.'})">Send test</button>`:`<button class="btn sm primary" onclick="S.notif='granted';renderPage()">Turn on</button>`}</div></div>
      </section>
    </div>`;
}
/* ---------- full-size live call view ---------- */
function renderLivePage(full){
  const root = document.getElementById('livePage'); if (!root) return;
  const c = C();
  if (!c) { root.innerHTML = `<div class="empty">No call in progress. Ask ${esc(S.agent.name)} to make one in the chat.</div>`; return; }
  const b = S.brief;
  if (full || !document.getElementById('lconvo')) {
    root.innerHTML = `<button class="back" onclick="goPage('chat')">‹ Back to chat</button>
      <div class="lhead"><span class="bav">${bizAvatar(c.business)}</span>
        <div><h1>${esc(c.business)}</h1><div class="meta">${esc(b.number)}. ${esc(b.goal)}</div></div>
        <div class="lclock"><b id="lclk">${fmt(Date.now()-c.t0)}</b><small>of 15:00 max ${tag('DC-15','P1')}</small></div></div>
      <div class="states lstates" id="lstates"></div>
      <div class="lgrid">
        <div class="rcard lconv"><h2 style="margin-bottom:4px">Live conversation ${tag('DC-3','P0')}</h2>
          <p class="small muted" style="margin:0 0 12px">${esc(c.business)} on the left, ${esc(S.agent.name)} on the right. Transcribed, audio not kept.</p>
          <div class="convo big" id="lconvo" aria-live="polite"></div></div>
        <div class="lside"><div id="lping"></div><div id="lctrl"></div></div>
      </div>`;
    clearInterval(S.lclk); S.lclk = setInterval(()=>{ const el = document.getElementById('lclk'); if (!el || !C()) { clearInterval(S.lclk); return; } if (C().status!=='Ended') el.textContent = fmt(Date.now()-C().t0); }, 1000);
  }
  document.getElementById('lstates').innerHTML = STATES.map(s=>`<span class="${c.status===s?'on':''} ${s==='Waiting on you'&&c.status===s?'w':''} ${s==='In phone menu'?'later':''}">${s}</span>`).join('') + ' ' + tag('DC-14','P0');
  const kindLbl = {acted:'Acted',asked:'Asked you',ended:'Ended',noted:'Noted'};
  const cv = document.getElementById('lconvo');
  cv.innerHTML = c.lines.map(l => {
    if (l[0]==='note') return `<div class="tnote"><span class="k ${l[2]}">${kindLbl[l[2]]}</span><b>${esc(l[1])}</b>. ${esc(l[3])}</div>`;
    if (l[0]==='you') return `<div class="tnote you">You told ${esc(S.agent.name)}: <b>${esc(l[1])}</b></div>`;
    const biz = l[0]==='biz';
    return `<div class="tline ${biz?'biz':'agent'}"><span class="tav">${biz?bizAvatar(c.business):avatarSVG(S.agent.look)}</span><div class="body"><span class="nm">${biz?'Dana':esc(S.agent.name)}</span><div class="bb">${esc(l[1])}</div></div></div>`;
  }).join('') + (c.status==='Dialing' ? '<div class="tnote">Dialing…</div>' : '') + (c.status==='Ended' ? '<div class="tnote">Call ended</div>' : '');
  cv.scrollTop = cv.scrollHeight;
  const lp = document.getElementById('lping');
  const key = c.status==='Ended' ? 'ended' : c.ping ? c.ping.id : 'none';
  if (full || lp.dataset.k !== key) {
    lp.dataset.k = key;
    lp.innerHTML = c.status==='Ended' ? (c.rec ? resultHTML(c.rec.id) : '') : c.ping ? pingHTML(c.ping) : `<div class="idle-live"><span class="av-wrap"><span class="ring"></span><span class="ring"></span>${avatarSVG(S.agent.look)}</span><b>${esc(S.agent.name)} is handling it</b><span>If ${esc(S.agent.name)} needs you, the question shows up right here. The line stays open while you answer. ${tag('DC-7','P0')}</span></div>`;
    if (c.ping && matchMedia('(max-width:900px)').matches) setTimeout(()=>lp.scrollIntoView({behavior:'smooth', block:'center'}), 50);
  }
  const ct = document.getElementById('lctrl');
  const draft = document.getElementById('linstr')?.value || '';
  ct.innerHTML = c.status==='Ended' ? '' : `<div class="lctrl">
      ${c.ping ? '' : `<div class="instr"><input class="input" id="linstr" placeholder="Tell ${esc(S.agent.name)} something, like “ask if they have Saturday”" onkeydown="if(event.key==='Enter')sendInstrFrom('linstr')" aria-label="Instruction"><button class="btn" onclick="sendInstrFrom('linstr')">Send ${tag('DC-10','P0')}</button></div>`}
      <button class="btn" onclick="togglePause()">${ic(c.paused?'play':'pause')}${c.paused?'Resume':'Pause'}</button>
      <button class="btn danger" onclick="endCall()">End call</button>
      <button class="btn" disabled>${ic('mic')}Take over ${tag('DC-12','P1')}</button></div>`;
  const ni = document.getElementById('linstr'); if (ni && draft) ni.value = draft;
}
function sendInstrFrom(id){ const src = document.getElementById(id); const tmp = document.getElementById('instr'); if (tmp) { tmp.value = src.value; src.value = ''; sendInstr(); } else { const v = src.value; src.value=''; const el = document.createElement('input'); el.id='instr'; el.value=v; el.hidden=true; document.body.appendChild(el); sendInstr(); el.remove(); } }
function pickEvGo(id){ S.page = 'calendar'; goPage('calendar'); pickEv(id); }

/* ---------- init ---------- */
$('#micb').innerHTML = ic('mic');
$('#sendb').innerHTML = ic('up');
document.querySelector('.composer .cbtn').innerHTML = ic('plus');
renderRail(); renderDrawer(); refresh();
startOb();
window.addEventListener('resize', ()=>renderPanel());
</script>
</body>
