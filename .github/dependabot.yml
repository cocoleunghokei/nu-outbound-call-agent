# Weekly PRs that bump pinned GitHub Actions and frontend npm and backend uv packages.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Minor/patch bumps land together; majors come one PR per group so a
    # breaking upgrade is easy to spot and hold back.
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
      eslint-major:
        patterns: ['eslint', '@eslint/*', 'eslint-plugin-*', 'typescript-eslint', 'globals']
        update-types: [major]
      vite-major:
        patterns: ['vite', '@vitejs/*']
        update-types: [major]
    # typescript-eslint doesn't support TypeScript 7 yet; drop this once it does.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      uv-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
