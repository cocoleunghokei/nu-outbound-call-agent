# Applies merged migrations to the shared Supabase project.
#
# Runs on every push to main that changes supabase/migrations/, or by hand from
# the Actions tab. Needs repository secrets SUPABASE_ACCESS_TOKEN and
# SUPABASE_DB_PASSWORD (see docs/devops.md). Until they exist, the job warns
# and skips, and migrations must be pushed by hand with `supabase db push`.
name: Deploy database

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-deploy
  cancel-in-progress: false  # never interrupt a migration halfway

jobs:
  deploy:
    name: supabase db push
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'tenmxbpwuxkicmgvmfym' }}
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase secrets are not configured; skipping deploy. Run 'supabase db push' by hand."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.creds.outputs.ready == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - if: steps.creds.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Show pending migrations
        if: steps.creds.outputs.ready == 'true'
        run: supabase db push --dry-run
      - name: Apply migrations
        if: steps.creds.outputs.ready == 'true'
        run: supabase db push --yes
