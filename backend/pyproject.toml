[project]
name = "call-agent-backend"
version = "0.1.0"
description = "Backend for the outbound call agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "jsonschema[format-nongpl]>=4.23",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "datamodel-code-generator>=0.90.0",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs a running local Supabase Postgres (make test-db)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Generated by contracts/gen_py.py; pre-commit must not rewrite it, or the drift check fails.
[tool.ruff.lint.per-file-ignores]
"app/contracts/generated.py" = ["E501", "I001", "F401"]

[tool.mypy]
strict = true
python_version = "3.12"
